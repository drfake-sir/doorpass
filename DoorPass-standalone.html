<style>
/* ============================================================
   DoorPass — design system
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #F2F5F0;
  --bg-2: #E9EEE6;
  --surface: #FFFFFF;
  --surface-2: #F7F9F5;
  --surface-3: #EFF3EC;
  --ink: #0D1712;
  --ink-2: #24352C;
  --muted: #62736A;
  --faint: #8A998F;
  --line: #DDE5DA;
  --line-strong: #C9D5C4;
  --brand: #0E6B4B;
  --brand-strong: #084C35;
  --brand-soft: #E2F2EA;
  --lime: #C9F36A;
  --lime-ink: #1B2A0A;
  --ok: #0F7B47;
  --ok-soft: #E2F5EA;
  --warn: #9A6200;
  --warn-soft: #FDF1D4;
  --bad: #C23535;
  --bad-soft: #FBE7E5;
  --info: #2D5BD1;
  --info-soft: #E8EDFC;
  --violet: #6B4BC4;
  --shadow-sm: 0 1px 2px rgba(13, 23, 18, .06);
  --shadow: 0 10px 30px -12px rgba(13, 23, 18, .18), 0 2px 6px rgba(13, 23, 18, .04);
  --shadow-lg: 0 30px 70px -24px rgba(6, 20, 14, .35);
  --r-xs: 8px;
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --sidebar: 244px;
  --topbar: 68px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Sora", "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #090E0B;
  --bg-2: #0D1410;
  --surface: #111A15;
  --surface-2: #0E1712;
  --surface-3: #17231C;
  --ink: #EDF4EF;
  --ink-2: #D5E2DA;
  --muted: #92A39A;
  --faint: #6F8077;
  --line: #223129;
  --line-strong: #2E4036;
  --brand: #37B984;
  --brand-strong: #6ADFA8;
  --brand-soft: #12291F;
  --lime: #C9F36A;
  --lime-ink: #142006;
  --ok: #4ED191;
  --ok-soft: #10281C;
  --warn: #F0B74A;
  --warn-soft: #2C240E;
  --bad: #FF7B73;
  --bad-soft: #301715;
  --info: #8EA8FF;
  --info-soft: #18213D;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow: 0 16px 40px -18px rgba(0, 0, 0, .8), 0 2px 6px rgba(0, 0, 0, .35);
  --shadow-lg: 0 40px 90px -30px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.modal-open { overflow: hidden; }

h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: -.02em; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; }
::selection { background: var(--lime); color: #101A05; }

:focus-visible {
  outline: 2.5px solid var(--brand);
  outline-offset: 2px;
}
.skip {
  position: fixed; left: 12px; top: 10px; z-index: 200;
  transform: translateY(-160%);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: var(--r-sm); font-weight: 600; text-decoration: none;
}
.skip:focus { transform: none; }

.ic { width: 18px; height: 18px; flex: none; stroke-width: 1.8; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 40;
  width: var(--sidebar);
  display: flex; flex-direction: column;
  background: #0A100D;
  color: #E8F0EA;
  border-right: 1px solid rgba(255, 255, 255, .06);
  padding: 18px 14px 14px;
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: #253129; border-radius: 8px; }

.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 20px; text-decoration: none; }
.brand__mark {
  width: 34px; height: 34px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--lime), #8FE04B);
  color: #12200A;
  box-shadow: 0 6px 18px -6px rgba(201, 243, 106, .55);
}
.brand__mark .ic { width: 19px; height: 19px; stroke-width: 2.2; }
.brand__word { font-family: var(--display); font-weight: 700; font-size: 17.5px; letter-spacing: -.03em; color: #F3F8F4; }
.brand__word span { color: var(--lime); }
.brand__tag { display: block; font-family: var(--font); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #7E9084; font-weight: 500; margin-top: 1px; }

.gym-card {
  display: flex; align-items: center; gap: 10px;
  background: #111A15; border: 1px solid #1E2B23;
  border-radius: var(--r); padding: 10px;
  margin-bottom: 18px;
}
.gym-card__logo {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: #1B2A21; color: var(--lime);
  font-family: var(--display); font-weight: 700; font-size: 13px;
  border: 1px solid #283A2F;
}
.gym-card__name { font-size: 12.5px; font-weight: 600; color: #EAF2EC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.gym-card__sub { font-size: 8.5px; color: #7E9084; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gym-card__badge {
  margin-left: auto; font-size: 8.5px; letter-spacing: .07em; text-transform: uppercase;
  font-weight: 700; color: #12200A; background: var(--lime);
  padding: 2px 5px; border-radius: 5px; flex: none;
}

.nav-label { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #60736A; font-weight: 600; padding: 0 10px; margin: 14px 0 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav__item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: 9px;
  color: #9DB0A4; text-decoration: none;
  font-size: 13.5px; font-weight: 500;
  border: 1px solid transparent;
  transition: background .15s, color .15s;
}
.nav__item:hover { background: #121C16; color: #E8F0EA; }
.nav__item.is-active { background: #17241C; color: #F4F9F5; border-color: #23342A; }
.nav__item.is-active .ic { color: var(--lime); }
.nav__item .ic { width: 17px; height: 17px; color: #7E9084; }
.nav__item kbd {
  margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: #7E9084;
  border: 1px solid #2A3A30; border-radius: 5px; padding: 1px 5px; background: #0D1510;
}
.nav__dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px rgba(201, 243, 106, .12); }

.sidebar__foot { margin-top: auto; padding-top: 18px; }
.device-card {
  background: #0F1812; border: 1px solid #1E2B23; border-radius: var(--r);
  padding: 11px; font-size: 11.5px; color: #90A297;
}
.device-card__row { display: flex; align-items: center; gap: 7px; }
.device-card__row + .device-card__row { margin-top: 6px; }
.device-card strong { color: #DFE9E2; font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot--warn { background: var(--warn); }
.dot--bad { background: var(--bad); }
.sidebar__reset {
  margin-top: 10px; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: transparent; border: 1px solid #24332A; color: #93A69A;
  border-radius: 9px; padding: 8px; font-size: 11.5px;
}
.sidebar__reset:hover { color: #E8F0EA; border-color: #3A4B40; }
.sidebar__tools { display: flex; gap: 6px; }
.sidebar__tools .sidebar__reset { margin-top: 10px; }
.sidebar__tools .sidebar__reset .ic { width: 13px; height: 13px; }

.main-wrap { flex: 1; min-width: 0; margin-left: var(--sidebar); display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--topbar);
  display: flex; align-items: center; gap: 16px;
  padding: 0 28px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar__crumb { font-size: 11px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.topbar__crumb span { color: var(--faint); }
.topbar__title { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
.topbar__right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.chip-status {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 10px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 11.5px; font-weight: 600; color: var(--muted);
}
.chip-status .dot { width: 6px; height: 6px; }

.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--muted);
  transition: border-color .15s, color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-2); }
.icon-btn .ic { width: 17px; height: 17px; }
.search-trigger {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm);
  color: var(--faint); font-size: 12.5px; min-width: 190px;
}
.search-trigger:hover { border-color: var(--line-strong); color: var(--muted); }
.search-trigger kbd { margin-left: auto; font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--surface-2); }
.menu-btn { display: none; }

main#main { flex: 1; padding: 24px 28px 56px; max-width: 1400px; width: 100%; margin: 0 auto; }

.demo-note {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--lime);
  border-radius: var(--r-sm); padding: 9px 14px;
  margin: 18px 28px -6px; font-size: 12px; color: var(--muted);
  max-width: 1344px;
}
.demo-note strong { color: var(--ink); font-weight: 600; }
.demo-note__body { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 220px; }
.demo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; margin-top: 6px; }
.demo-note code { font-family: var(--mono); font-size: 11px; background: var(--surface-3); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
.demo-note button { margin-left: auto; background: none; border: 0; color: var(--faint); font-size: 11.5px; padding: 4px 6px; }
.demo-note button:hover { color: var(--ink); }

/* ---------- primitives ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
}
.card--pad { padding: 18px; }
.card--flush { overflow: hidden; }
.card__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card__head h2 { font-size: 15px; }
.card__head .mut { margin-left: auto; }
.card__eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

.mut { color: var(--muted); font-size: 12.5px; }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: -.02em; }
.hidden { display: none !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 13px;
  transition: background .15s, border-color .15s, transform .06s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
.btn:active { transform: translateY(1px); }
.btn .ic { width: 16px; height: 16px; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--brand) 70%, transparent); }
.btn--primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
:root[data-theme="dark"] .btn--primary { color: #06140D; }
.btn--lime { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.btn--lime:hover { background: #B9E85A; border-color: #B9E85A; }
.btn--ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn--ghost:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn--danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); background: var(--surface); }
.btn--danger:hover { background: var(--bad-soft); }
.btn--sm { min-height: 32px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn--xs { min-height: 28px; padding: 0 8px; font-size: 11.5px; border-radius: 7px; }
.btn--lg { min-height: 50px; padding: 0 20px; font-size: 14.5px; border-radius: 12px; }
.btn--block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  padding: 3px 8px; border-radius: 99px; white-space: nowrap;
  background: var(--surface-3); color: var(--muted);
}
.pill--ok { background: var(--ok-soft); color: var(--ok); }
.pill--warn { background: var(--warn-soft); color: var(--warn); }
.pill--bad { background: var(--bad-soft); color: var(--bad); }
.pill--info { background: var(--info-soft); color: var(--info); }
.pill--brand { background: var(--brand-soft); color: var(--brand); }
.pill--outline { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.pill .dot { width: 5px; height: 5px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-height: 30px; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: 99px; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); font-size: 11.5px; font-weight: 600;
}
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip.is-on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip__n { font-size: 10px; opacity: .7; font-family: var(--mono); }

.input, .select, .textarea {
  width: 100%; min-height: 40px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--ink); font-size: 13px;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}
.input::placeholder { color: var(--faint); }
.textarea { min-height: 76px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11px; color: var(--faint); }
.field .err { font-size: 11px; color: var(--bad); }
.input-wrap { position: relative; }
.input-wrap .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.input-wrap .input { padding-left: 34px; }

.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch__track {
  width: 36px; height: 21px; border-radius: 99px; flex: none;
  background: var(--line-strong); position: relative; transition: background .18s;
}
.switch__track::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 15px; height: 15px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .18s;
}
.switch input:checked + .switch__track { background: var(--brand); }
.switch input:checked + .switch__track::after { transform: translateX(15px); }
.switch input:focus-visible + .switch__track { outline: 2.5px solid var(--brand); outline-offset: 2px; }

.search { position: relative; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
.search input { padding-left: 34px; }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 9.5px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--surface-2); }

.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: 12px;
  color: #fff; background: hsl(var(--h, 160) 38% 34%);
  border: 2px solid color-mix(in srgb, hsl(var(--h, 160) 38% 34%) 20%, transparent);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
}
.avatar--sm { width: 28px; height: 28px; font-size: 10px; }
.avatar--lg { width: 64px; height: 64px; font-size: 20px; }
.avatar--xl { width: 84px; height: 84px; font-size: 27px; }

/* ---------- page header ---------- */
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { font-size: 25px; letter-spacing: -.035em; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 620px; }
.page-head__actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- door ---------- */
.door-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .door-grid { grid-template-columns: 300px minmax(0, 1fr); } }

.find-card { padding: 14px; position: sticky; top: calc(var(--topbar) + 16px); }
.find-card .card__head { margin-bottom: 10px; }
.member-list { margin-top: 10px; max-height: 470px; overflow-y: auto; margin-right: -4px; padding-right: 4px; }
.member-list::-webkit-scrollbar { width: 6px; }
.member-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
.mrow {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 8px; border-radius: 10px; border: 1px solid transparent;
  background: none; text-align: left; color: var(--ink);
}
.mrow:hover { background: var(--surface-2); border-color: var(--line); }
.mrow.is-sel { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 25%, var(--line)); }
.mrow__body { flex: 1; min-width: 0; }
.mrow__name { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.mrow__meta { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.mrow .pill { font-size: 9.5px; padding: 2px 6px; }
.list-empty { padding: 20px 10px; text-align: center; color: var(--faint); font-size: 12px; }

.scan-panel {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background:
    radial-gradient(900px 400px at 50% -10%, color-mix(in srgb, var(--brand) 8%, transparent), transparent 70%),
    var(--surface);
  min-height: 560px;
  display: flex; flex-direction: column;
}
.scan-stage { flex: 1; display: flex; flex-direction: column; padding: 26px; }
.scan-stage__status {
  --tone: var(--muted); --tone-soft: var(--surface-3);
  position: relative; border-radius: var(--r-lg);
  border: 1px solid color-mix(in srgb, var(--tone) 26%, var(--line));
  background:
    radial-gradient(600px 260px at 50% 0%, color-mix(in srgb, var(--tone) 12%, transparent), transparent 70%),
    var(--surface);
  padding: 24px; overflow: hidden;
}
.scan-stage__status::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 3px;
  background: linear-gradient(90deg, transparent, var(--tone), transparent);
  opacity: .8;
}
.tone-ok { --tone: var(--ok); }
.tone-warn { --tone: var(--warn); }
.tone-bad { --tone: var(--bad); }
.tone-muted { --tone: var(--muted); }

.verdict-top { display: flex; align-items: flex-start; gap: 18px; }
.verdict-icon {
  width: 92px; height: 92px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--tone-soft, var(--surface-3));
  color: var(--tone);
  border: 1px solid color-mix(in srgb, var(--tone) 22%, transparent);
  box-shadow: 0 0 0 8px color-mix(in srgb, var(--tone) 7%, transparent);
}
.verdict-icon .ic { width: 42px; height: 42px; stroke-width: 2.4; }
.verdict-copy { min-width: 0; padding-top: 4px; }
.verdict-eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--tone); margin-bottom: 4px; }
.verdict-title { font-family: var(--display); font-size: 30px; line-height: 1.08; letter-spacing: -.04em; }
.verdict-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.verdict-person { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.verdict-person__name { font-weight: 600; font-size: 13.5px; }
.verdict-person__meta { font-size: 11.5px; color: var(--muted); }

.verdict-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.vmeta { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.vmeta__k { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.vmeta__v { font-size: 12.5px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .verdict-meta { grid-template-columns: 1fr 1fr; } }

.verdict-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

.scan-idle {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 22px; min-height: 420px;
}
.scan-frame {
  position: relative; width: 168px; height: 168px; margin-bottom: 22px;
  border-radius: 24px; background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  display: grid; place-items: center;
}
.scan-frame .corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--brand); border-radius: 4px; }
.scan-frame .corner:nth-child(1) { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.scan-frame .corner:nth-child(2) { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.scan-frame .corner:nth-child(3) { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.scan-frame .corner:nth-child(4) { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.scan-frame .scan-line {
  position: absolute; left: 14px; right: 14px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--brand), transparent);
  box-shadow: 0 0 14px 2px color-mix(in srgb, var(--brand) 45%, transparent);
  animation: scan 2.6s cubic-bezier(.45, 0, .55, 1) infinite;
}
.scan-frame > .ic { width: 50px; height: 50px; color: var(--faint); opacity: .45; stroke-width: 1.2; }
@keyframes scan { 0%, 100% { top: 20px; opacity: .35; } 50% { top: 146px; opacity: 1; } }
.scan-idle h2 { font-size: 22px; letter-spacing: -.03em; }
.scan-idle p { color: var(--muted); font-size: 12.5px; max-width: 360px; margin-top: 6px; }
.scan-idle .chips { justify-content: center; margin-top: 16px; }

.demo-scenarios { margin-top: 22px; width: 100%; max-width: 430px; }
.demo-scenarios .card__eyebrow { text-align: center; margin-bottom: 8px; }
.scenario-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.scenario {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px;
  padding: 8px 6px; font-size: 11px; font-weight: 600; color: var(--ink-2);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.scenario:hover { border-color: var(--brand); background: var(--brand-soft); }
.scenario span { font-size: 9.5px; color: var(--faint); font-weight: 500; }
.scenario i { width: 7px; height: 7px; border-radius: 50%; display: block; }

.stage-foot {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  border-top: 1px solid var(--line); margin-top: 20px; padding-top: 13px;
  font-size: 11.5px; color: var(--muted);
}
.stage-foot .dot { margin-right: -10px; }
.stage-foot strong { color: var(--ink); font-weight: 600; }
.stage-foot button { margin-left: auto; }

.feed { padding: 14px 18px; }
.feed__title { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.feed__title h2 { font-size: 13px; }
.feed__title .mut { margin-left: auto; font-size: 11px; }
.feed-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.feed-row:first-of-type { border-top: 0; }
.feed-row__body { flex: 1; min-width: 0; }
.feed-row__name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.feed-row__meta { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.feed-row time { font-size: 10px; color: var(--faint); font-family: var(--mono); }

.banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border-radius: var(--r-sm); padding: 10px 14px; font-size: 12px;
  background: var(--warn-soft); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 20%, transparent);
  margin-bottom: 14px;
}
.banner strong { font-weight: 700; }
.banner button { margin-left: auto; }

/* renewal */
.renew { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; }
.renew__head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.renew__head h3 { font-size: 14px; }
.renew__head .pill { margin-left: auto; }
.plans { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
@media (max-width: 720px) { .plans { grid-template-columns: repeat(2, 1fr); } }
.plan {
  position: relative; text-align: left; padding: 10px 9px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
  color: var(--ink); min-height: 74px;
}
.plan:hover { border-color: var(--line-strong); }
.plan.is-on { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 10%, transparent); }
.plan__label { display: block; font-size: 11.5px; font-weight: 700; line-height: 1.2; }
.plan__price { display: block; font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -.03em; margin-top: 3px; line-height: 1.1; }
.plan__per { display: block; font-size: 9.5px; color: var(--faint); margin-top: 1px; line-height: 1.2; }
.plan__offer { position: absolute; top: -7px; right: 6px; font-size: 8.5px; font-weight: 800; letter-spacing: .03em; background: var(--lime); color: var(--lime-ink); padding: 2px 5px; border-radius: 4px; }

.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; gap: 2px; margin-top: 11px; flex-wrap: wrap; }
.seg button {
  border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600;
  padding: 6px 11px; border-radius: 7px; min-height: 30px; display: inline-flex; align-items: center; gap: 5px;
}
.seg button:hover { color: var(--ink); }
.seg button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.renew__cta { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.renew__cta .btn { flex: 1; min-width: 180px; }
.renew__note { font-size: 10.5px; color: var(--faint); margin-top: 7px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.renew__note .ic { width: 12px; height: 12px; }

/* ---------- dashboard ---------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: 18px; padding: 22px 24px;
  background:
    radial-gradient(700px 300px at 88% -30%, rgba(201, 243, 106, .28), transparent 60%),
    radial-gradient(500px 240px at 20% 120%, rgba(58, 182, 128, .22), transparent 60%),
    linear-gradient(115deg, #08281B, #0D4B34 55%, #10664A);
  color: #F2F8F4; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  border: 1px solid #1C5C42;
  box-shadow: 0 20px 46px -26px rgba(8, 40, 27, .8);
  margin-bottom: 16px;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, .10) 1px, transparent 1px);
  background-size: 18px 18px; opacity: .5; mask-image: linear-gradient(90deg, transparent, #000);
  pointer-events: none;
}
.hero__main { position: relative; z-index: 1; }
.hero__k { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #A9C9B6; font-weight: 600; }
.hero__v { font-family: var(--display); font-size: 38px; line-height: 1.05; letter-spacing: -.05em; font-weight: 600; margin-top: 4px; }
.hero__delta { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--lime); margin-top: 5px; font-weight: 600; }
.hero__delta .ic { width: 13px; height: 13px; }
.hero__atrisk { margin-left: auto; position: relative; z-index: 1; text-align: right; background: rgba(4, 22, 14, .28); border: 1px solid rgba(201, 243, 106, .22); padding: 10px 14px; border-radius: 12px; backdrop-filter: blur(4px); }
.hero__atrisk b { display: block; font-family: var(--display); font-size: 22px; letter-spacing: -.04em; color: #F7E9C8; }
.hero__atrisk span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #A9C9B6; font-weight: 600; }
.hero__spark { position: absolute; right: 20px; bottom: 12px; opacity: .4; width: 220px; height: 56px; z-index: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 13px 14px; text-align: left; color: var(--ink); min-height: 0;
  display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, transform .06s;
}
button.kpi:hover { border-color: var(--line-strong); }
button.kpi:active { transform: translateY(1px); }
.kpi__k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi__v { font-family: var(--display); font-size: 24px; letter-spacing: -.04em; font-weight: 600; }
.kpi__sub { font-size: 10.5px; color: var(--muted); }
.kpi--alert .kpi__v { color: var(--bad); }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 980px) { .dash-grid { grid-template-columns: 1fr; } }

.chart-card { padding: 18px; }
.chart-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.chart-head h2 { font-size: 15px; }
.chart-head .mut { font-size: 11.5px; }
.chart-toggle { margin-left: auto; }
.chart-wrap { position: relative; margin-top: 6px; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-tip {
  position: absolute; pointer-events: none; z-index: 3;
  background: var(--ink); color: var(--bg); border-radius: 7px;
  padding: 5px 9px; font-size: 10.5px; font-weight: 600;
  transform: translate(-50%, -120%); opacity: 0; transition: opacity .1s;
  white-space: nowrap; box-shadow: var(--shadow);
}
.chart-tip.is-on { opacity: 1; }
.chart-tip span { display: block; font-size: 9px; opacity: .7; font-weight: 500; }

.digest { padding: 18px; display: flex; flex-direction: column; }
.digest-bubble {
  background: #DCF8C6; color: #12210F; border-radius: 12px 12px 12px 3px;
  padding: 12px 14px; font-size: 12px; line-height: 1.55; white-space: pre-line;
  box-shadow: var(--shadow-sm); font-family: var(--font);
}
:root[data-theme="dark"] .digest-bubble { background: #1F3A28; color: #DDF3E3; }
.digest-bubble b { font-weight: 700; }
.digest-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.digest-foot .mut { font-size: 10.5px; }

.queue { padding: 18px; }
.queue__row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-top: 1px solid var(--line); }
.queue__row:first-of-type { border-top: 0; }
.queue__badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 800; background: var(--surface-3); color: var(--muted); flex: none; }
.queue__badge--now { background: var(--warn-soft); color: var(--warn); }
.queue__body { flex: 1; min-width: 0; }
.queue__t { font-size: 12px; font-weight: 600; display: block; }
.queue__s { font-size: 10.5px; color: var(--muted); display: block; }
.queue__cost { font-size: 10.5px; color: var(--faint); font-family: var(--mono); }

.auto-card { padding: 18px; margin-bottom: 16px; }
.setting-row { display: flex; align-items: flex-start; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.setting-row:first-of-type { border-top: 0; padding-top: 0; }
.setting-row__body { flex: 1; min-width: 0; }
.setting-row__t { font-size: 12.5px; font-weight: 600; }
.setting-row__s { font-size: 11px; color: var(--muted); margin-top: 1px; display: block; }
.setting-row .select { width: auto; min-width: 76px; min-height: 34px; padding: 4px 8px; font-size: 12px; }

/* member table */
.list-card { padding: 0; overflow: hidden; }
.list-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 15px 16px 0; }
.list-head h2 { font-size: 15px; }
.list-head .mut { font-size: 11px; }
.list-tools { margin-left: auto; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.list-tools .search input { min-height: 34px; font-size: 12px; width: 190px; }
.list-filters { padding: 10px 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }

.mtable { width: 100%; }
.mtable__head, .mtable__row {
  display: grid;
  grid-template-columns: minmax(180px, 1.6fr) 92px 92px 116px 120px 132px;
  gap: 10px; align-items: center; padding: 9px 16px;
}
.mtable__head {
  font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  font-weight: 700; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.mtable__row { border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.mtable__row:hover { background: var(--surface-2); }
.mtable__row:last-child { border-bottom: 0; }
.mtable__name { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mtable__n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.mtable__p { font-size: 10.5px; color: var(--muted); display: block; }
.mcell { font-size: 11.5px; color: var(--muted); min-width: 0; }
.mcell b { color: var(--ink); font-weight: 600; }
.mtable__actions { display: flex; gap: 5px; justify-content: flex-end; }
.mtable__actions .btn { min-height: 28px; padding: 0 7px; font-size: 10.5px; border-radius: 7px; }
.mtable__actions .icon-btn { width: 28px; height: 28px; border-radius: 7px; }

.empty { padding: 38px 20px; text-align: center; }
.empty h3 { font-size: 15px; margin-bottom: 4px; }
.empty p { color: var(--muted); font-size: 12px; }

@media (max-width: 900px) {
  .mtable__head { display: none; }
  .mtable__row { grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 14px; align-items: start; }
  .mtable__name { grid-column: 1; }
  .mtable__actions { grid-column: 2; grid-row: 1; }
  .mcell--plan, .mcell--ends { display: none; }
  .mcell--status { grid-column: 1; }
  .mcell--pay { grid-column: 2; grid-row: 2; justify-self: end; }
}

/* ---------- member phone ---------- */
.member-layout { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 980px) { .member-layout { grid-template-columns: 1fr; } }

.preview-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.preview-tools .select { width: auto; min-width: 170px; min-height: 36px; }

.phone {
  width: 100%; max-width: 400px; margin: 0 auto;
  border-radius: 34px; padding: 10px;
  background: linear-gradient(160deg, #1A2820, #070C09);
  box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(255, 255, 255, .08);
  position: relative;
}
.phone__screen {
  border-radius: 26px; overflow: hidden;
  background: var(--bg);
  min-height: 660px;
  position: relative;
}
.phone__notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 82px; height: 18px; background: #050806; border-radius: 99px; z-index: 4; }
.phone__status { display: flex; justify-content: space-between; align-items: center; padding: 13px 18px 0; font-size: 9.5px; font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.phone__status .icons { display: flex; gap: 3px; align-items: center; }
.phone__status .icons i { display: block; width: 12px; height: 8px; border: 1px solid currentColor; border-radius: 2px; }
.phone__status .icons i:last-child { width: 16px; border: 0; height: 8px; background: linear-gradient(90deg, currentColor 78%, transparent 78%); border-radius: 1px; }
.phone__body { padding: 12px 14px 20px; }
.member-top { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.member-top__gym { font-size: 12px; font-weight: 700; display: block; }
.member-top__sub { font-size: 9.5px; color: var(--muted); display: block; }
.member-top .icon-btn { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; position: relative; }
.member-top .icon-btn .dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; }

.member-hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 16px;
  background:
    radial-gradient(420px 200px at 90% -20%, rgba(201, 243, 106, .3), transparent 65%),
    linear-gradient(135deg, #0A3021, #0F5C3F 65%, #13795A);
  color: #F1F8F3; box-shadow: 0 18px 36px -22px rgba(5, 35, 23, .8);
}
.member-hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 16px 16px; opacity: .35; mask-image: linear-gradient(120deg, transparent 30%, #000); pointer-events: none; }
.member-hero__top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.member-hero__k { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #A9C9B6; font-weight: 600; }
.member-hero__name { font-family: var(--display); font-size: 18px; letter-spacing: -.03em; margin-top: 2px; }
.member-hero__id { font-family: var(--mono); font-size: 9.5px; color: #A9C9B6; margin-top: 2px; }
.member-hero__ring { position: relative; width: 86px; height: 86px; flex: none; }
.member-hero__ring svg { width: 86px; height: 86px; transform: rotate(-90deg); }
.member-hero__ring .bg { stroke: rgba(255, 255, 255, .16); }
.member-hero__ring .fg { stroke: var(--lime); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.member-hero__ring .txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.member-hero__ring b { font-family: var(--display); font-size: 22px; line-height: 1; letter-spacing: -.04em; }
.member-hero__ring span { font-size: 7.5px; text-transform: uppercase; letter-spacing: .1em; color: #B7D2C1; margin-top: 2px; }
.member-hero__foot { display: flex; align-items: center; gap: 6px; margin-top: 14px; position: relative; z-index: 1; flex-wrap: wrap; }
.member-hero__foot .pill { background: rgba(255, 255, 255, .12); color: #EAF4EE; backdrop-filter: blur(2px); }
.member-hero__foot .pill--ok { background: rgba(201, 243, 106, .18); color: var(--lime); }
.member-hero__foot .pill--warn { background: rgba(240, 183, 74, .18); color: #F5CE85; }
.member-hero__foot .pill--bad { background: rgba(255, 123, 115, .18); color: #FFB0AA; }

.qr-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; text-align: center; }
.qr-box { width: 186px; height: 186px; margin: 2px auto 8px; padding: 10px; background: #fff; border-radius: 12px; box-shadow: var(--shadow-sm); }
.qr-box svg { width: 100%; height: 100%; }
.qr-meta { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 9.5px; color: var(--muted); }
.qr-meta .mono { font-size: 9px; color: var(--faint); }
.qr-bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin: 9px auto 5px; width: 186px; }
.qr-bar i { display: block; height: 100%; background: var(--brand); transition: width .25s linear; }
.qr-hint { font-size: 9.5px; color: var(--faint); }

.member-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
.member-actions button { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px; font-size: 10px; font-weight: 600; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); min-height: 0; }
.member-actions button:hover { border-color: var(--line-strong); background: var(--surface-2); }
.member-actions .ic { width: 17px; height: 17px; color: var(--brand); }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 13px; margin-top: 12px; }
.sheet h3 { font-size: 12px; margin-bottom: 2px; }
.sheet .mut { font-size: 10px; }
.sheet .plans { grid-template-columns: 1fr 1fr; margin-top: 9px; gap: 6px; }
.sheet .plan { min-height: 62px; padding: 8px; }
.sheet .plan__price { font-size: 14px; }
.sheet .seg { width: 100%; margin-top: 8px; }
.sheet .seg button { flex: 1; justify-content: center; }
.sheet .btn--lg { min-height: 44px; font-size: 13px; margin-top: 9px; }

.member-section { margin-top: 14px; }
.member-section__head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.member-section__head h3 { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.member-section__head span { margin-left: auto; font-size: 9.5px; color: var(--faint); }
.hist { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-top: 1px solid var(--line); }
.hist:first-of-type { border-top: 0; }
.hist__ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); flex: none; }
.hist__ic .ic { width: 13px; height: 13px; }
.hist__body { flex: 1; min-width: 0; }
.hist__t { font-size: 11px; font-weight: 600; display: block; }
.hist__s { font-size: 9.5px; color: var(--muted); display: block; }
.hist__a { font-size: 11px; font-weight: 700; font-family: var(--display); }
.hist button { border: 0; background: none; color: var(--brand); font-size: 9.5px; font-weight: 600; padding: 3px 4px; }

.notice { display: flex; gap: 9px; padding: 9px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); margin-top: 7px; }
.notice .ic { width: 15px; height: 15px; color: var(--brand); margin-top: 1px; }
.notice__t { font-size: 10.5px; font-weight: 600; display: block; }
.notice__s { font-size: 9.5px; color: var(--muted); margin-top: 1px; display: block; }

.phone-caption { text-align: center; margin-top: 16px; font-size: 11px; color: var(--faint); }

.side-notes { display: flex; flex-direction: column; gap: 12px; }
.note-card { padding: 16px; }
.note-card h3 { font-size: 13px; margin-bottom: 3px; }
.note-card p { font-size: 11.5px; color: var(--muted); }
.note-card ul { margin: 9px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.note-card li { display: flex; gap: 8px; font-size: 11.5px; color: var(--ink-2); }
.note-card li .ic { width: 14px; height: 14px; color: var(--ok); margin-top: 2px; }

/* ---------- audit ---------- */
.audit-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .audit-grid { grid-template-columns: 1fr; } }
.evt { display: grid; grid-template-columns: 74px 96px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 11.5px; }
.evt:last-child { border-bottom: 0; }
.evt--head { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); }
.evt time { font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
.evt__d { min-width: 0; }
.evt__t { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.evt__s { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.evt__a { text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
@media (max-width: 640px) {
  .evt { grid-template-columns: 58px minmax(0, 1fr); }
  .evt--head { display: none; }
  .evt .pill { grid-column: 2; justify-self: start; }
  .evt__d { grid-column: 1 / -1; }
  .evt__a { grid-column: 2; text-align: left; }
}

.posture { padding: 16px; }
.posture__row { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid var(--line); }
.posture__row:first-of-type { border-top: 0; }
.posture__ic { width: 26px; height: 26px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; flex: none; }
.posture__ic .ic { width: 14px; height: 14px; }
.posture__t { font-size: 11.5px; font-weight: 600; }
.posture__s { font-size: 10.5px; color: var(--muted); }

/* ---------- ROI ---------- */
.roi-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 20px; }
@media (max-width: 960px) { .roi-grid { grid-template-columns: 1fr; } }
.calc { padding: 20px; }
.slider { margin-top: 15px; }
.slider__top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.slider__k { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.slider__v { margin-left: auto; font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--brand); }
.slider input[type=range] { width: 100%; accent-color: var(--brand); height: 22px; }
.slider__scale { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--faint); }
.slider__hint { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
.slider__hint b { color: var(--ink-2); font-weight: 700; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }

.result {
  position: relative; overflow: hidden; padding: 22px;
  background:
    radial-gradient(500px 240px at 100% 0%, rgba(201, 243, 106, .2), transparent 60%),
    linear-gradient(140deg, #08281B, #0C4632);
  color: #F1F8F3; border-radius: var(--r); border: 1px solid #1C5C42;
}
.result__k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #A9C9B6; font-weight: 600; }
.result__v { font-family: var(--display); font-size: 42px; letter-spacing: -.055em; line-height: 1.05; margin: 2px 0 2px; }
.result__row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid rgba(255, 255, 255, .12); font-size: 11.5px; }
.result__row span:first-child { color: #A9C9B6; }
.result__row b { margin-left: auto; font-weight: 700; }
.result__callout { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(201, 243, 106, .10); border: 1px solid rgba(201, 243, 106, .25); font-size: 11.5px; color: #DDF3C6; }
.result__callout b { color: var(--lime); }

.plans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 900px) { .plans-grid { grid-template-columns: 1fr; } }
.price-card { position: relative; padding: 20px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.price-card--featured { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }
.price-card__tag { position: absolute; top: -10px; left: 18px; background: var(--lime); color: var(--lime-ink); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; }
.price-card h3 { font-size: 15px; }
.price-card__price { font-family: var(--display); font-size: 30px; letter-spacing: -.05em; line-height: 1; }
.price-card__price small { font-family: var(--font); font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.price-card__was { font-size: 10.5px; color: var(--faint); text-decoration: line-through; }
.price-card__list { list-style: none; margin: 2px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.price-card__list li { display: flex; gap: 7px; font-size: 11.5px; color: var(--ink-2); }
.price-card__list .ic { width: 13px; height: 13px; color: var(--ok); margin-top: 2px; }
.price-card .btn { margin-top: auto; }

.guarantee { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: var(--r); border: 1px dashed color-mix(in srgb, var(--brand) 45%, var(--line)); background: var(--brand-soft); }
.guarantee .ic { color: var(--brand); width: 22px; height: 22px; flex: none; }
.guarantee h3 { font-size: 13.5px; }
.guarantee p { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* ---------- modal / drawer ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 10, 7, .55);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fade .16s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: 100%; max-width: 520px; max-height: calc(100vh - 40px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden;
  animation: pop .18s cubic-bezier(.2, .9, .3, 1.1);
}
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal--wide { max-width: 760px; }
.modal__head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; }
.modal__head h2 { font-size: 17px; letter-spacing: -.03em; }
.modal__head p { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.modal__head .icon-btn { margin-left: auto; flex: none; }
.modal__body { padding: 0 20px 20px; overflow-y: auto; }
.modal__foot { display: flex; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.modal__foot .btn { flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.form-grid .span2 { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span2 { grid-column: auto; } }

.pin-input { display: flex; gap: 8px; justify-content: center; margin: 8px 0 4px; }
.pin-input input {
  width: 52px; height: 58px; text-align: center;
  font-family: var(--mono); font-size: 22px; font-weight: 600;
  border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2);
}
.pin-input input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent); }
.pin-input.is-bad input { border-color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.err-line { text-align: center; color: var(--bad); font-size: 11.5px; min-height: 18px; }

.receipt { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--surface-2); font-size: 12px; }
.receipt__head { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--line-strong); }
.receipt__gym { font-family: var(--display); font-weight: 600; font-size: 14px; }
.receipt__no { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; }
.receipt__rows { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.receipt__row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
.receipt__row b { color: var(--ink); font-weight: 600; }
.receipt__total { border-top: 1px dashed var(--line-strong); margin-top: 8px; padding-top: 8px; display: flex; justify-content: space-between; font-family: var(--display); font-size: 15px; font-weight: 600; }
.receipt__fine { margin-top: 10px; font-size: 9.5px; color: var(--faint); line-height: 1.5; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.detail { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.detail__k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; }
.detail__v { font-size: 12px; font-weight: 600; margin-top: 1px; }
.detail-grid .span2 { grid-column: 1 / -1; }
.drawer-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.drawer-actions .btn { flex: 1; min-width: 120px; }

/* ---------- QR scanner ---------- */
.scanner { display: flex; flex-direction: column; gap: 12px; }
.scanner__viewport {
  position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 340px;
  background: #07100B; border-radius: 14px; overflow: hidden;
  display: grid; place-items: center;
}
.scanner__viewport video { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
.scanner__frame { position: absolute; width: min(62%, 230px); aspect-ratio: 1; pointer-events: none; }
.scanner__frame span { position: absolute; width: 28px; height: 28px; border: 3px solid var(--lime); border-radius: 6px; }
.scanner__frame span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.scanner__frame span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.scanner__frame span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.scanner__frame span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.scanner__frame i { position: absolute; left: 6%; right: 6%; top: 8%; height: 2px; background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: scanline 2.2s ease-in-out infinite; }
@keyframes scanline { 0%, 100% { top: 8%; opacity: .35; } 50% { top: 90%; opacity: 1; } }
.scanner__status {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  padding: 8px 11px; border-radius: 8px; font-size: 11px; font-weight: 600; text-align: center;
  color: #EAF2EC; background: rgba(4, 10, 7, .74); backdrop-filter: blur(8px);
}
.scanner__status.is-bad { color: #FFB4AD; }
.scanner__manual label { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.scanner__row { display: flex; gap: 7px; }
.scanner__row .input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px; }
.scanner__row .btn { flex: none; }
@media (max-width: 520px) {
  .scanner__row { flex-direction: column; }
  .scanner__row .btn { width: 100%; }
}

/* ---------- palette ---------- */
.palette { width: 100%; max-width: 560px; align-self: flex-start; margin-top: 8vh; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
.palette__search { display: flex; align-items: center; gap: 9px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.palette__search .ic { color: var(--faint); }
.palette__search input { border: 0; background: none; width: 100%; font-size: 14px; outline: none; }
.palette__search kbd { font-family: var(--mono); font-size: 9.5px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; color: var(--faint); }
.palette__list { max-height: 360px; overflow-y: auto; padding: 6px; }
.palette__item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; text-align: left; color: var(--ink); }
.palette__item:hover, .palette__item.is-sel { background: var(--surface-2); }
.palette__item__body { flex: 1; min-width: 0; }
.palette__item__t { font-size: 12.5px; font-weight: 600; }
.palette__item__s { font-size: 10.5px; color: var(--muted); }
.palette__item .pill { font-size: 9px; }
.palette__group { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 8px 10px 4px; }
.palette__empty { padding: 24px; text-align: center; color: var(--faint); font-size: 12px; }

/* ---------- toast ---------- */
#toast-root { position: fixed; z-index: 200; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 9px;
  background: var(--ink); color: var(--bg);
  border-radius: 11px; padding: 10px 14px; font-size: 12px; font-weight: 500;
  box-shadow: var(--shadow-lg); animation: toastin .22s cubic-bezier(.2, .9, .3, 1.1);
  pointer-events: auto;
}
.toast .ic { width: 15px; height: 15px; flex: none; }
.toast--ok .ic { color: var(--lime); }
.toast--bad .ic { color: #FF9B94; }
.toast--warn .ic { color: #F5CE85; }
.toast.is-out { animation: toastout .2s forwards; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes toastout { to { opacity: 0; transform: translateY(6px) scale(.98); } }

/* ---------- mobile nav ---------- */
.mobilenav { display: none; }

@media (max-width: 1024px) {
  .sidebar { transform: translateX(-100%); transition: transform .22s; }
  .sidebar.is-open { transform: none; box-shadow: var(--shadow-lg); }
  .main-wrap { margin-left: 0; }
  .menu-btn { display: grid; }
  main#main { padding: 18px 16px 92px; }
  .topbar { padding: 0 16px; gap: 10px; }
  .search-trigger { min-width: 0; }
  .search-trigger span { display: none; }
  .search-trigger kbd { display: none; }
  .demo-note { margin: 12px 16px -2px; }
  .mobilenav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 35;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px); border-top: 1px solid var(--line);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .mobilenav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: var(--faint); font-size: 9.5px; font-weight: 600;
    padding: 5px 2px; border-radius: 8px;
  }
  .mobilenav a .ic { width: 19px; height: 19px; }
  .mobilenav a.is-active { color: var(--brand); }
  .mobilenav a.is-active .ic { color: var(--brand); }
}

@media (max-width: 760px) {
  .door-grid { grid-template-columns: 1fr; }
  .find-card { position: static; }
  .member-list { max-height: 260px; }
  .scan-panel { min-height: 480px; }
  .scan-stage { padding: 16px; }
  .verdict-top { gap: 12px; }
  .verdict-icon { width: 64px; height: 64px; }
  .verdict-icon .ic { width: 30px; height: 30px; }
  .verdict-title { font-size: 23px; }
  .hero { padding: 18px; }
  .hero__v { font-size: 32px; }
  .hero__atrisk { margin-left: 0; text-align: left; }
  .member-layout { gap: 16px; }
  .page-head h1 { font-size: 21px; }
  .topbar__title { font-size: 14px; }
  .page-head__actions { margin-left: 0; }
}

@media (max-width: 520px) {
  .hide-xs { display: none !important; }
  .demo-note { font-size: 11px; }
  .modal { max-height: calc(100vh - 16px); }
  .overlay { padding: 8px; }
  .plan__price { font-size: 14px; }
  .verdict-meta { grid-template-columns: 1fr 1fr; }
  .stage-foot { gap: 10px; }
  .stage-foot button { margin-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .scan-frame .scan-line { display: none; }
}

@media print {
  body * { visibility: hidden !important; }
  .receipt, .receipt * { visibility: visible !important; }
  .receipt { position: fixed; inset: 0; margin: 0; border: 0; border-radius: 0; padding: 24px; }
}

/* ---------- door relay simulator ---------- */
.relay { display: flex; align-items: center; gap: 11px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); transition: border-color .2s, background .2s; }
.relay.is-open { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-soft); animation: relayGlow 1.4s ease-out; }
.relay.is-blocked { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-soft); animation: relayShake .35s; }
.relay__gate { position: relative; width: 38px; height: 38px; border-radius: 9px; background: var(--surface-3); border: 1px solid var(--line); flex: none; overflow: hidden; }
.relay__gate i { position: absolute; top: 7px; bottom: 7px; width: 10px; background: var(--line-strong); border-radius: 2px; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.relay__gate i:first-child { left: 8px; }
.relay__gate i:last-child { right: 8px; }
.relay.is-open .relay__gate i:first-child { transform: translateX(-13px) skewY(-8deg); }
.relay.is-open .relay__gate i:last-child { transform: translateX(13px) skewY(8deg); }
.relay.is-open .relay__gate { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.relay__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.relay__k { display: flex; align-items: center; gap: 4px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.relay__k .ic { width: 11px; height: 11px; }
.relay__t { font-size: 12px; font-weight: 700; color: var(--ink); }
.relay__s { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.relay__led { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--faint) 20%, transparent); }
.relay.is-open .relay__led { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); animation: ledPulse 1s infinite; }
.relay.is-blocked .relay__led { background: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); }
.relay__btns { display: flex; align-items: center; gap: 4px; flex: none; }
@keyframes ledPulse { 50% { opacity: .35; } }
@keyframes relayGlow { from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); } to { box-shadow: none; } }
@keyframes relayShake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

/* ---------- retention radar ---------- */
.ret-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.radar-card { padding: 18px; }
.risk-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.risk-row:first-of-type { border-top: 0; padding-top: 2px; }
.risk-score { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: conic-gradient(var(--sc) calc(var(--p) * 1%), var(--surface-3) 0); }
.risk-score::before { content: ''; position: absolute; inset: 4px; background: var(--surface); border-radius: 50%; }
.risk-score b { position: relative; font-family: var(--display); font-size: 13px; line-height: 1; }
.risk-score i { position: relative; font-style: normal; font-size: 7px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 1px; }
.risk-score--bad { --sc: var(--bad); }
.risk-score--warn { --sc: var(--warn); }
.risk-score--info { --sc: var(--brand); }
.risk-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.risk-name { font-size: 12.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.risk-sent { font-style: normal; font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; background: var(--ok-soft); color: var(--ok); padding: 2px 5px; border-radius: 4px; font-weight: 700; }
.risk-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.risk-tags span { font-size: 9.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); padding: 2px 6px; border-radius: 20px; }
.risk-val { font-family: var(--display); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.risk-val small { font-size: 9px; color: var(--faint); font-family: var(--font); font-weight: 500; }
.risk-acts { display: flex; align-items: center; gap: 4px; }
.radar-foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-size: 10.5px; color: var(--muted); }
.campaign-card { padding: 18px; display: flex; flex-direction: column; }
.camp-to { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-bottom: 7px; }
.camp-bubble { background: #DCF8C6; color: #0B2A16; border-radius: 12px 12px 12px 3px; padding: 11px 12px; font-size: 11.5px; line-height: 1.45; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04); }
:root[data-theme="dark"] .camp-bubble { background: #173B27; color: #DFF5E6; }
.camp-stats { display: flex; gap: 14px; font-size: 10.5px; color: var(--muted); margin: 12px 0; }
.camp-stats b { color: var(--ink); font-weight: 700; }
.camp-note { font-size: 10px; color: var(--faint); margin-top: 8px; line-height: 1.5; }
.forecast-card { padding: 18px; margin-bottom: 16px; }
.forecast { display: grid; grid-template-columns: 180px minmax(0, 1fr) 240px; gap: 22px; align-items: center; margin-top: 6px; }
.forecast__big span { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.forecast__big b { display: block; font-family: var(--display); font-size: 32px; letter-spacing: -.05em; line-height: 1.1; margin: 3px 0; }
.forecast__big small { font-size: 10px; color: var(--ok); font-weight: 600; }
.forecast__meters { display: flex; flex-direction: column; gap: 10px; }
.meter { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 10.5px; color: var(--muted); }
.meter b { color: var(--ink); font-family: var(--mono); font-size: 10.5px; }
.meter i { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--brand); opacity: .75; display: block; transition: width .3s; }
.meter--ok i { background: var(--ok); }
.meter--warn i { background: var(--warn); }
.forecast__rate label { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.forecast__rate label b { color: var(--ink); }
.forecast__rate input { width: 100%; accent-color: var(--brand); }
.forecast__scale { display: flex; justify-content: space-between; font-size: 9px; color: var(--faint); margin-top: 2px; }
.forecast__foot { font-size: 10px; color: var(--faint); margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }

/* ---------- campaign modal ---------- */
.camp-targets { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.camp-check { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.camp-check:hover { background: var(--surface-2); }
.camp-check input { accent-color: var(--brand); flex: none; }
.camp-check__body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.camp-check__n { font-size: 11.5px; font-weight: 650; }
.camp-check__s { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.camp-check__score { font-family: var(--mono); font-size: 10px; color: var(--warn); background: var(--warn-soft); border-radius: 5px; padding: 2px 5px; }
.camp-preview__k { display: flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 6px; }
.camp-preview .camp-bubble { max-width: 100%; }

@media (max-width: 980px) {
  .ret-grid { grid-template-columns: 1fr; }
  .forecast { grid-template-columns: 1fr 1fr; }
  .forecast__rate { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .forecast { grid-template-columns: 1fr; gap: 16px; }
  .risk-val { display: none; }
  .risk-acts .btn { font-size: 0; gap: 0; padding: 0 7px; }
  .risk-acts .btn .ic { width: 13px; height: 13px; }
  .relay { gap: 8px; }
  .relay__s { white-space: normal; }
  .relay__btns .btn { display: none; }
}
.camp-playbook { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; }
.camp-step { display: flex; gap: 8px; align-items: flex-start; }
.camp-step span { width: 18px; height: 18px; border-radius: 50%; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; font-size: 9px; font-weight: 800; flex: none; }
.camp-step p { font-size: 10px; color: var(--faint); line-height: 1.45; }
.camp-step b { color: var(--muted); display: block; font-size: 10.5px; }
.camp-step code { font-size: 9.5px; }

/* ============================================================
   REFERRAL ENGINE
   ============================================================ */
.hero--ref {
  background:
    radial-gradient(700px 300px at 88% -30%, rgba(201, 243, 106, .22), transparent 60%),
    radial-gradient(520px 240px at 18% 130%, rgba(107, 75, 196, .42), transparent 62%),
    linear-gradient(115deg, #191233, #2A1F52 55%, #382A6B);
  border-color: #42337A;
}
.hero--ref .hero__delta { color: #D9C9FF; }
.ref-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.ref-board, .ref-engine, .ref-activity { padding: 18px; }
.ref-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.ref-row:first-of-type { border-top: 0; padding-top: 2px; }
.ref-rank { width: 18px; flex: none; font-family: var(--mono); font-size: 10px; color: var(--faint); text-align: center; }
.ref-rank--gold { color: #B8860B; font-weight: 800; font-size: 12px; }
.ref-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ref-row__n { font-size: 12.5px; font-weight: 650; }
.ref-row__c { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref-row > .ref-row__n { font-family: var(--mono); font-size: 14px; min-width: 20px; text-align: center; }
.ref-row > .ref-row__n.is-zero { color: var(--faint); }
.ref-row__acts { display: flex; align-items: center; gap: 4px; }
.ref-linkbox { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; }
.ref-linkbox code { font-family: var(--mono); font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ref-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); }
.ref-meta span { display: flex; align-items: center; gap: 5px; }
.ref-meta .ic { width: 13px; height: 13px; color: var(--brand); }
.ref-meta b { color: var(--ink); }
.ref-act { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.ref-act:first-of-type { border-top: 0; }
.ref-act__ic { width: 30px; height: 30px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.ref-act__ic .ic { width: 14px; height: 14px; }
.ref-act__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ref-act__t { font-size: 12px; font-weight: 600; }
.ref-act__s { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref-act time { font-size: 9.5px; color: var(--faint); flex: none; }
.kpi--good .kpi__v { color: var(--ok); }

/* ============================================================
   PEAK-HOUR HEATMAP
   ============================================================ */
.heat-card { padding: 18px; margin-bottom: 16px; }
.heat { display: grid; grid-template-columns: 42px repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.heat__h { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-align: center; font-weight: 600; padding-bottom: 2px; }
.heat__d { display: flex; align-items: center; font-size: 10px; font-weight: 600; color: var(--muted); }
.heat__c {
  height: 34px; border: 0; border-radius: 6px; cursor: pointer;
  background: color-mix(in srgb, var(--brand) calc(var(--i) * 58%), var(--surface-2));
  color: var(--ink); font-family: var(--mono); font-size: 9.5px;
  display: grid; place-items: center; transition: transform .12s, box-shadow .12s;
}
:root[data-theme="dark"] .heat__c { color: #EAF4EE; background: color-mix(in srgb, var(--brand) calc(var(--i) * 40%), var(--surface-2)); }
.heat__c:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.heat__c.is-peak { box-shadow: inset 0 0 0 1.5px var(--lime); font-weight: 700; }
.heat__c.is-sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat__foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.heat__foot span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.heat__foot b { font-size: 11.5px; font-weight: 650; }
.heat__foot em { font-style: normal; font-size: 10px; color: var(--muted); }
.heat__foot .btn { margin-left: auto; flex: none; }

/* ============================================================
   KIOSK MODE
   ============================================================ */
body.kiosk-on { overflow: hidden; }
.kiosk {
  position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column;
  padding: clamp(14px, 2.6vw, 32px); color: #EAF4EE;
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(55, 185, 132, .22), transparent 62%),
    radial-gradient(700px 420px at 50% 120%, rgba(201, 243, 106, .10), transparent 60%),
    #05110B;
  animation: kioskIn .28s ease-out;
}
@keyframes kioskIn { from { opacity: 0; } to { opacity: 1; } }
.kiosk__top { display: flex; align-items: center; gap: 14px; flex: none; }
.kiosk__brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.kiosk__mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(201, 243, 106, .12); color: var(--lime); border: 1px solid rgba(201, 243, 106, .28); }
.kiosk__mark .ic { width: 18px; height: 18px; }
.kiosk__gym { margin-left: 4px; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); font-family: var(--font); font-size: 10px; font-weight: 600; letter-spacing: .04em; color: #B9CCBF; text-transform: uppercase; }
.kiosk__clock { margin-left: auto; font-family: var(--mono); font-size: clamp(15px, 2vw, 20px); color: #B9CCBF; }
.kiosk__top .btn { color: #DCE9E1; border-color: rgba(255, 255, 255, .2); }
.kiosk__top .btn:hover { background: rgba(255, 255, 255, .08); }
.kiosk__stage { flex: 1; display: grid; place-items: center; min-height: 0; padding: 18px 0; }
.kiosk__idle { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; width: 100%; max-width: 620px; }
.kiosk__scan { width: clamp(96px, 14vw, 138px); height: clamp(96px, 14vw, 138px); border-radius: 50%; display: grid; place-items: center; color: var(--lime); border: 2px dashed rgba(201, 243, 106, .5); background: radial-gradient(circle, rgba(201, 243, 106, .14), transparent 70%); animation: kioskPulse 2.4s ease-in-out infinite; }
.kiosk__scan .ic { width: 48%; height: 48%; }
@keyframes kioskPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(201, 243, 106, .18); } 50% { box-shadow: 0 0 0 18px rgba(201, 243, 106, 0); } }
.kiosk__hint { font-family: var(--display); font-size: clamp(24px, 4.4vw, 46px); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.kiosk__sub { font-size: clamp(11px, 1.3vw, 14px); color: #9FB4A7; }
.kiosk__actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.kiosk__btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 11px; border: 1px solid rgba(201, 243, 106, .4); background: var(--lime); color: #10210E; font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer; }
.kiosk__btn .ic { width: 17px; height: 17px; }
.kiosk__btn--ghost { background: transparent; color: #DCE9E1; border-color: rgba(255, 255, 255, .24); }
.kiosk__btn--ghost:hover { background: rgba(255, 255, 255, .07); }
.kiosk__manual { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 18px; width: 100%; max-width: 520px; }
.kiosk__manual input { flex: 1; min-width: 170px; min-height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .06); color: #EAF4EE; font-size: 12px; }
.kiosk__manual input::placeholder { color: #7C8F83; }
.kiosk__manual .err { flex-basis: 100%; text-align: center; }
.kiosk__verdict { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; animation: kioskVerdict .3s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes kioskVerdict { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.kiosk__icon { width: clamp(76px, 11vw, 104px); height: clamp(76px, 11vw, 104px); border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px; }
.kiosk__icon .ic { width: 56%; height: 56%; }
.kiosk__verdict--open .kiosk__icon { background: rgba(55, 185, 132, .16); color: #61E3A8; box-shadow: 0 0 0 10px rgba(55, 185, 132, .08); }
.kiosk__verdict--blocked .kiosk__icon { background: rgba(194, 53, 53, .18); color: #FF8B8B; box-shadow: 0 0 0 10px rgba(194, 53, 53, .08); }
.kiosk__name { font-family: var(--display); font-size: clamp(28px, 5vw, 52px); font-weight: 600; letter-spacing: -.04em; line-height: 1.05; }
.kiosk__msg { font-size: clamp(14px, 1.8vw, 19px); color: #CFE0D6; }
.kiosk__verdict--open .kiosk__msg { color: #8CEBBF; }
.kiosk__verdict--blocked .kiosk__msg { color: #FFA9A9; }
.kiosk__bottom { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .1); }
.kiosk__stats { display: flex; gap: clamp(14px, 3vw, 34px); }
.kiosk__stats div { display: flex; flex-direction: column; gap: 1px; }
.kiosk__stats b { font-family: var(--display); font-size: clamp(18px, 2.4vw, 26px); letter-spacing: -.03em; }
.kiosk__stats span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #7E9488; font-weight: 600; }
.kiosk__recent { display: flex; align-items: center; gap: 14px; min-width: 0; overflow: hidden; }
.kiosk__recent__k { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: #7E9488; font-weight: 700; flex: none; }
